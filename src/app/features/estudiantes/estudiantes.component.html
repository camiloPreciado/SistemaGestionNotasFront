<div class="estudiantes-container">

  <h1>Estudiantes</h1>

  <div class="acciones">
    <button
      *ngIf="esAdmin()"
      type="button"
      routerLink="/estudiantes/crear">
      Nuevo estudiante
    </button>

  </div>

  <div *ngIf="loading">
    Cargando estudiantes...
  </div>

  <div *ngIf="errorMessage">
    {{ errorMessage }}
  </div>

  <table *ngIf="!loading && estudiantes.length > 0">

    <thead>
      <tr>
        <th>ID</th>
        <th>Usuario ID</th>
        <th>Nombre</th>
        <th *ngIf="esAdmin()">Acciones</th>
      </tr>
    </thead>

    <tbody>

      <tr *ngFor="let estudiante of estudiantes">

        <td>
          {{ estudiante.id }}
        </td>

        <td>
          {{ estudiante.usuarioId }}
        </td>

        <td>
          {{ estudiante.nombre }}
        </td>

        <td *ngIf="esAdmin()">
          <button
            type="button"
            (click)="editar(estudiante)">
            Editar
          </button>

          <button
            type="button"
            (click)="eliminar(estudiante)">
            Eliminar
          </button>
        </td>

      </tr>

    </tbody>

  </table>

  <div
    class="pagination"
    *ngIf="!loading && totalPages > 0">

    <button
        type="button"
        (click)="paginaAnterior()"
        [disabled]="page === 1">
        Anterior
    </button>

    <span>
        Página {{ page }} de {{ totalPages }}
    </span>

    <button
        type="button"
        (click)="paginaSiguiente()"
        [disabled]="page === totalPages">
        Siguiente
    </button>

    </div>

  <div *ngIf="!loading && estudiantes.length === 0">
    No hay estudiantes registrados.
  </div>

</div>
