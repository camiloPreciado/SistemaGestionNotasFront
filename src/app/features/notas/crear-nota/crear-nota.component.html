<div class="crear-nota-container">

  <h1>Crear nota</h1>

  <div
    *ngIf="errorMessage">

    {{ errorMessage }}

  </div>

  <form
    (ngSubmit)="crear()">

    <div>

      <label for="idEstudiante">
        ID del estudiante
      </label>

      <input
        id="idEstudiante"
        type="number"
        name="idEstudiante"
        [(ngModel)]="idEstudiante"
        min="1"
        required>

    </div>

    <div>

      <label for="nombre">
        Nombre de la asignatura
      </label>

      <input
        id="nombre"
        type="text"
        name="nombre"
        [(ngModel)]="nombre"
        maxlength="100"
        required>

    </div>

    <div>

      <label for="valor">
        Nota
      </label>

      <input
        id="valor"
        type="number"
        name="valor"
        [(ngModel)]="valor"
        min="0"
        max="5"
        step="0.1"
        required>

    </div>

    <div>

      <button
        type="submit"
        [disabled]="loading">

        {{ loading ? 'Creando...' : 'Crear' }}

      </button>

      <button
        type="button"
        (click)="cancelar()"
        [disabled]="loading">

        Cancelar

      </button>

    </div>

  </form>

</div>
